<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandarin time</title>
<style>
  :root {
    --fg: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --bg: #f5f5f7; --card: #fff;
    --zh: #d0402b; --zh-soft: #f6d5cf; --mixed: #e59a2f; --other: #c7c7cc; --warn-bg: #fff4e5; --warn: #9a5b00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f2f2f7; --muted: #98989d; --line: #3a3a3c; --bg: #1c1c1e; --card: #2c2c2e;
      --zh: #ff6b55; --zh-soft: #5a2a22; --mixed: #f0ad4e; --other: #545458; --warn-bg: #3d2e12; --warn: #ffcc80; }
  }
  * { box-sizing: border-box; }
  body { font: 14px/1.45 -apple-system, system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 18px; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; }
  h1 button { font-size: 13px; }
  .card { background: var(--card); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; }
  .warn { background: var(--warn-bg); color: var(--warn); }
  .warn p { margin: 4px 0; }

  /* week */
  #week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; }
  .day { background: none; border: 0; padding: 6px 0 4px; border-radius: 10px; cursor: pointer; color: var(--fg); font: inherit; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .day:hover { background: var(--bg); }
  .day.sel { background: var(--bg); outline: 2px solid var(--zh); }
  .day .bar { width: 60%; height: 90px; display: flex; flex-direction: column; justify-content: flex-end; }
  .day .bar div { background: var(--zh); border-radius: 4px 4px 0 0; min-height: 2px; }
  .day .t { font-size: 12px; font-weight: 600; } .day .d { font-size: 11px; color: var(--muted); }
  #week-total { color: var(--muted); font-size: 13px; margin-top: 10px; }

  /* selected day */
  #day-title { color: var(--muted); font-size: 13px; }
  #total { font-size: 40px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; color: var(--zh); }
  #total small { font-size: 16px; font-weight: 500; color: var(--fg); }
  #total-extra { color: var(--muted); margin-top: 4px; }
  .split { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 14px; background: var(--line); }
  .split div { height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

  /* sources */
  .src-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .src-head b { font-size: 16px; } .src-head span { color: var(--zh); font-weight: 600; }
  .item { display: grid; grid-template-columns: 1fr auto 70px; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
  .item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .time { text-align: right; font-variant-numeric: tabular-nums; }
  .item .meter { grid-column: 1 / -1; height: 3px; background: var(--line); border-radius: 2px; margin-top: -4px; }
  .item .meter div { height: 100%; border-radius: 2px; }
  .item.dim .name, .item.dim .time { color: var(--muted); }
  .why { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin-top: -4px; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 9px; white-space: nowrap; background: var(--bg); color: var(--muted); }
  .tag.mandarin { background: var(--zh-soft); color: var(--zh); }
  .tag.mixed { color: var(--mixed); }
  .tag.bad { color: var(--warn); background: var(--warn-bg); }
  details.rest summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 7px 0; border-top: 1px solid var(--line); list-style: none; }
  details.rest summary::-webkit-details-marker { display: none; }
  details.rest summary::before { content: "▸ "; } details.rest[open] summary::before { content: "▾ "; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }

  a { color: inherit; text-decoration: none; } a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .link { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; font-size: 12px; }
  #settings label { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); }
  #settings label:first-of-type { border-top: 0; }
  #settings input { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  input[type=number] { width: 70px; }
  .muted { color: var(--muted); font-size: 13px; }
  /* The toolbar popup: same page, narrower and tighter. */
  body.popup { width: 420px; }
  body.popup main { padding: 14px 12px 16px; }
  body.popup .card { padding: 14px 14px; margin-bottom: 10px; }
  body.popup .day .bar { height: 60px; }
  body.popup #total { font-size: 32px; }
  body.popup .why { display: none; }
</style>
</head>
<body>
<main>
  <h1><span>Mandarin time</span><span><button id="open-tab">Open in a tab</button> <button id="toggle-settings">Settings</button></span></h1>

  <div class="card warn" id="problems" hidden>
    <div id="problem-list"></div>
    <button id="dismiss">Dismiss</button>
  </div>

  <div class="card" id="settings" hidden>
    <label>A chat or document counts as Mandarin when this much of it is Chinese <span><input type="number" id="threshold" min="1" max="100"> %</span></label>
    <label>Stop counting reading and chats after this long without input <span><input type="number" id="idle" min="10" max="3600"> s</span></label>
    <label>Readwise access token, to add reading on your phone <input type="password" id="readwise" placeholder="readwise.io/access_token"></label>
    <div class="muted" id="reader-status"></div>
    <p><button id="export">Export all data (JSON)</button></p>
  </div>

  <div class="card">
    <div id="week"></div>
    <div id="week-total"></div>
  </div>

  <div class="card">
    <div id="day-title"></div>
    <div id="total"></div>
    <div id="total-extra"></div>
    <div class="split" id="split"></div>
    <div class="legend">
      <span><i class="dot" style="background:var(--zh)"></i>Mandarin</span>
      <span><i class="dot" style="background:var(--mixed)"></i>Partly Mandarin</span>
      <span><i class="dot" style="background:var(--other)"></i>Not Mandarin</span>
      <span><i class="dot" style="background:var(--line)"></i>Waiting for a label</span>
    </div>
  </div>

  <div id="sources"></div>
</main>
<script type="module" src="build/dashboard.js"></script>
</body>
</html>
